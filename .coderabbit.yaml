language: "fa-IR"
reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  path_filters:
    - "!dist/**"
    - "!dist-server/**"
    - "!package-lock.json"
    - "!data/**"
  path_instructions:
    - path: "src/**"
      instructions: "Check TypeScript types, SQLite query safety, Persian RTL UI consistency, and alignment with TASKS.md goals."
    - path: "tests/**"
      instructions: "Ensure Playwright E2E tests verify both UI interactions and backend logic without flaky selectors."
chat:
  auto_reply: true
